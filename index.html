<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./src/css/reset.css" />
    <link rel="stylesheet" href="./src/css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header-container">
        <div class="search">
          <form class="search-form">
            <input
              id="search-movie"
              type="search"
              placeholder=" "
              data-search
            />
            <label for="search-movie">Введіть назву фільму</label>
          </form>
        </div>
        <!-- второй баттон -->
        <div class="ganre" data-filter>
          <h2 class="header-title"></h2>
          <select class="ganre-list">
            <option disabled selected class="ganre-item" value="">
              Оберіть жанр
            </option>
            <option class="ganre-item" data-ganre="drama">Драма</option>
            <option class="ganre-item" data-ganre="crime">Кримінал</option>
            <option class="ganre-item" data-ganre="mystery">Містика</option>
            <option class="ganre-item" data-ganre="biography">
              Біографічні
            </option>
            <option class="ganre-item" data-ganre="western">Вестерн</option>
            <option class="ganre-item" data-ganre="comedy">Комедія</option>
            <option class="ganre-item" data-ganre="family">Сімейні</option>
            <option class="ganre-item" data-ganre="animation">
              Анімаційні
            </option>
            <option class="ganre-item" data-ganre="romance">Романтичні</option>
            <option class="ganre-item" data-ganre="music">Мюзикли</option>
            <option class="ganre-item" data-ganre="adventure">Пригоди</option>
            <option class="ganre-item" data-ganre="thriller">Триллер</option>
            <option class="ganre-item" data-ganre="sci-fi">Сай-фай</option>
            <option class="ganre-item" data-ganre="action">Екшн</option>
          </select>
        </div>
        <!--  баттон  -->
        <div class="sort">
          <select name="sort" id="sort" data-sort>
            <button><selectedcontent> </selectedcontent></button>
            <option disabled selected>Sort by</option>
            <option value="year">Рік</option>
            <option value="rating">Оцінка</option>
          </select>
        </div>
      </div>
    </header>
    <main>
      <section class="movies">
        <div class="container">
          <div class="movies-container" data-movies></div>
        </div>
      </section>
      <script type="module" src="./src/js/main.js"></script>
    </main>
  </body>
</html>
